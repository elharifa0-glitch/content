<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F7F8FB; font-family: Tajawal, Arial, sans-serif; }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:18px; }
  .mark { position:relative; width:72px; height:72px; display:flex; align-items:center; justify-content:center; }
  .glow {
    position:absolute; inset:0; border-radius:50%;
    background: linear-gradient(135deg, #F2811A 0%, #F2631F 45%, #F24A24 75%, #E63929 100%);
    filter: blur(16px);
    animation: glow 2.2s ease-in-out infinite;
  }
  .ring {
    position:absolute; inset:-8px; border-radius:50%;
    background: conic-gradient(from 0deg, #F2811A, #E63929, transparent 300deg, #F2811A);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: spin 1.6s linear infinite;
  }
  svg { position:relative; z-index:1; animation: breathe 2.2s ease-in-out infinite; }
  .text { font-size:13.5px; font-weight:700; color:#5B6472; }
  .dot { display:inline-block; animation: dot 1.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity:.35; transform:scale(1);} 50% { opacity:.7; transform:scale(1.2);} }
  @keyframes spin { to { transform:rotate(360deg);} }
  @keyframes breathe { 0%,100% { transform:scale(1);} 50% { transform:scale(1.08);} }
  @keyframes dot { 0%,80%,100% { opacity:.25;} 40% { opacity:1;} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <div class="glow"></div>
      <div class="ring"></div>
      <svg width="40" height="40" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="g1" x1="12" y1="10" x2="88" y2="92" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF9F2D"/>
            <stop offset="1" stop-color="#FF4D3D"/>
          </linearGradient>
        </defs>
        <rect x="6" y="6" width="88" height="88" rx="23" fill="url(#g1)"/>
        <path d="M42,28 L18,28 L18,50 L42,50 L42,72 L18,72" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50,28 L82,28 M66,28 L66,72" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="text">بيحمّل الاستوديو<span class="dot">.</span><span class="dot" style="animation-delay:0.2s">.</span><span class="dot" style="animation-delay:0.4s">.</span></span>
  </div>
</body>
</html>
